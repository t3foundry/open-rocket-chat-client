<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sovereign trust for a connected World. T3Foundry secure chat." />

    <!--
      `favicon.svg` carries both colour variants behind a `prefers-color-scheme`
      query, so browsers that support SVG favicons switch with the OS theme. The
      `.ico` is the fallback for those that do not, and always uses the amber
      tile — it reads against light and dark browser chrome alike.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/t3f-cube.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Matches `--orc-surface-app` in each scheme, so the mobile browser chrome
         blends into the app rather than framing it. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFD" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1121" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap"
      rel="stylesheet"
    />

    <title>T3Foundry Chat</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <!-- Runtime configuration injected by the container entrypoint.  Must load
         before the app bundle so `window.__GATEWAY_URL__` is available. -->
    <script src="/env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
