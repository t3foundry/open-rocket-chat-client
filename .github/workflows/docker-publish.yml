name: Docker

on:
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout client
        uses: actions/checkout@v4
        with:
          path: open-rocket-chat-client

      # The shared API contract lives in the gateway repository and is resolved
      # through a pnpm `link:` override, so it has to be checked out as a
      # sibling. The Dockerfile expects the PARENT directory as its build context
      # for the same reason — a `link:` cannot reach outside the context.
      - name: Checkout gateway (shared contract)
        uses: actions/checkout@v4
        with:
          repository: t3foundry/rocket-chat-gateway
          path: open-rocket-chat-gateway
          token: ${{ secrets.CONTRACT_REPO_TOKEN || github.token }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # VITE_GATEWAY_URL defaults to empty, which tells the client to connect
      # to the same origin the app is served from. Override it with a repository
      # variable when the gateway runs at a different origin.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: open-rocket-chat-client/docker/web.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GATEWAY_URL=${{ vars.VITE_GATEWAY_URL || '' }}
            VITE_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max